<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACC Livery Viewer</title>
	<script type="importmap"> { 
        "imports": { 
            "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", 
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
            } 
        } </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <script src="data.js"></script>
    <script src="util.js"></script>
    <script type="module" src="colour-picker.js"></script>
    <script type="module" src="main.js" defer></script>
    <script>
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('liveryId') && urlParams.has('attritionUrl')) {
                window.loadLiveryFromAttrition = async (liveryId, attritionUrl) => {
                    try {
                        const url = `${attritionUrl}/liveries/${liveryId}/preview-viewer`;
                        const response = await fetch(url);
                        if (!response.ok) {
                            throw new Error(`Failed to fetch livery: ${response.status}`);
                        }
                        const data = await response.json();
                        if (!data.encodedFiles) {
                            throw new Error('No livery data available');
                        }
                        await window.loadLiveryFilesFromUrl(data.encodedFiles);
                    } catch (error) {
                        console.error('[loadLiveryFromAttrition] Failed to load livery from attrition:', error);
                        alert('Failed to load livery from attrition. Please try again later.');
                    }
                };
                window.loadLiveryFilesFromUrl = async (encodedFiles) => {
                    console.log('[loadLiveryFilesFromUrl] Starting with encodedFiles length:', encodedFiles?.length);
                    if (!encodedFiles) {
                        console.error('[loadLiveryFilesFromUrl] No encoded files parameter provided');
                        return;
                    }

                    try {
                        const decodedJson = window.base64Decode(encodedFiles);
                        const files = JSON.parse(decodedJson);

                        const filePromises = [];

                        Object.entries(files).forEach(([filename, base64Content], index) => {
                            const promise = new Promise((resolve) => {
                                try {
                                    const content = window.base64Decode(base64Content);

                                    if (filename.endsWith('.json')) {
                                        try {
                                            const jsonContent = JSON.parse(content);
                                            if (window.fileActions[filename]) {
                                                window.fileActions[filename](jsonContent);
                                            }
                                        } catch (jsonError) {
                                            console.error(`[loadLiveryFilesFromUrl] Failed to parse JSON file ${filename}`, jsonError);
                                        }
                                     } else if (filename.endsWith('.png')) {
                                        // Content is already decoded base64, convert to Uint8Array for Blob
                                        const bytes = new Uint8Array(content.length);
                                        for (let i = 0; i < content.length; i++) {
                                            bytes[i] = content.charCodeAt(i);
                                        }
                                        const blob = new Blob([bytes], { type: 'image/png' });
                                        const file = new File([blob], filename, { type: 'image/png' });
                                        const fileUrl = URL.createObjectURL(file);
                                        if (window.fileActions[filename]) {
                                            window.fileActions[filename](file);
                                        }
                                    }

                                    resolve();
                                } catch (error) {
                                    console.error(`[loadLiveryFilesFromUrl] Failed to load file ${filename} from URL`, error);
                                    resolve();
                                }
                            });
                            filePromises.push(promise);
                        });

                        await Promise.all(filePromises);

                        setTimeout(async () => {
                            try {
                                await window.materialManager.mergeAndSetDecals(window.state.currentLivery);
                            } catch (error) {
                                console.error('[loadLiveryFilesFromUrl] Failed to merge decals after loading livery files', error);
                            }
                        }, 100);
                    } catch (error) {
                        console.error('[loadLiveryFilesFromUrl] Error in loadLiveryFilesFromUrl', error);
                        console.error('[loadLiveryFilesFromUrl] Error details:', error.message);
                        console.error('[loadLiveryFilesFromUrl] Error stack:', error.stack);
                    }
                };

                window.base64Decode = function(str) {
                    if (!str || str.trim() === '') {
                        return '';
                    }
                    try {
                        const decoded = window.atob(str);
                        
                        // Check if this is binary data (contains bytes > 127)
                        // Binary data will have %xx sequences when escaped, which causes decodeURIComponent to fail
                        const isBinary = /[^\x00-\x7F]/.test(decoded);
                        
                        if (isBinary) {
                            return decoded;
                        } else {
                            return decodeURIComponent(escape(decoded));
                        }
                    } catch (e) {
                        console.error('[base64Decode] Base64 decode error:', e);
                        return '';
                    }
                };

                window.fileActions = {
                    'decals.png': (file) => {
                        console.log('[fileActions decals.png] Received file:', file.name, file.type, file.size);
                        if (window.state && window.state.decalsFile) {
                            console.log('[fileActions decals.png] Revoking old URL:', window.state.decalsFile);
                            URL.revokeObjectURL(window.state.decalsFile);
                        }
                        const newUrl = URL.createObjectURL(file);
                        console.log('[fileActions decals.png] Creating new URL:', newUrl);
                        window.materialManager.setDecalsFile(newUrl);
                        console.log('[fileActions decals.png] Decals file URL set');
                    },
                    'sponsors.png': (file) => {
                        console.log('[fileActions sponsors.png] Received file:', file.name, file.type, file.size);
                        if (window.state.sponsorsFile) {
                            console.log('[fileActions sponsors.png] Revoking old URL:', window.state.sponsorsFile);
                            URL.revokeObjectURL(window.state.sponsorsFile);
                        }
                        const newUrl = URL.createObjectURL(file);
                        console.log('[fileActions sponsors.png] Creating new URL:', newUrl);
                        window.materialManager.setSponsorsFile(newUrl);
                        console.log('[fileActions sponsors.png] Sponsors file URL set:', window.state.sponsorsFile);
                    },
                    'decals.json': (content) => {
                        paintMaterials.customDecal = content;
                    },
                    'sponsors.json': (content) => {
                        paintMaterials.customSponsor = content;
                    },
                    'car.json': async (content) => {
                        const { bodyColours, bodyMaterials } = await window.materialManager.applyCarJsonData(content);
                        window.uiController.updateColourPickers(bodyColours);
                        window.uiController.updateMaterialSelectors(bodyMaterials);
                        
                        // The applyCarJsonData method will handle loading the model based on carModelType
                        // and setting the current model path, livery, and UI selectors
                    },
                };

                // Load livery from attrition after UI is ready
                setTimeout(() => {
                    window.loadLiveryFromAttrition(urlParams.get('liveryId'), urlParams.get('attritionUrl'));
                }, 100);
            }
        });
    </script>
</head>
<body class="bg-light">

    <input type="file" id="fileInput" style="display: none;" multiple>

    <div class="container-fluid mt-2">
      <div id="settingsLayer" class="row">
            <div class="col-md-3">
            <div class="card">
              <div class="card-header p-2">Render Settings</div>
              <div class="card-body p-2">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="skybox-toggle">
                  <label class="form-check-label" for="skybox-toggle">Enable Skybox</label>
                </div>

                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="post-processing-toggle" checked>
                  <label class="form-check-label" for="post-processing-toggle">Enable Post-processing</label>
                </div>

                <div class="mb-2">
                  <label for="cubemapSelector" class="form-label form-label-sm">Cubemap:</label>
                  <select class="form-select form-select-sm" id="cubemapSelector"></select>
                </div>
              </div>
            </div>
          </div>
          
          <div class="col-md-3">
            <div class="card">
              <div class="card-header p-2">Car Settings</div>
              <div class="card-body p-2">
                <div class="row">
                  <div class="col-6">
                    <label for="modelSelector" class="form-label form-label-sm">Car:</label>
                    <select class="form-select form-select-sm" id="modelSelector"></select>
                  </div>
                  <div class="col-6">
                    <label for="liverySelector" class="form-label form-label-sm">Skin:</label>
                    <select class="form-select form-select-sm" id="liverySelector"></select>
                  </div>
                </div>
                <div class="mb-2">
                  <label for="lodSelector" class="form-label form-label-sm">Level of Detail:</label>
                  <select class="form-select form-select-sm" id="lodSelector">
                      <option value="1">1</option>
                      <option value="2">2</option>
                      <option value="3" selected="selected">3</option>
                      <option value="4">4</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
          
          <div class="col-md-3">
            <div class="card">
              <div class="card-header p-2">Livery Settings</div>
              <div class="card-body p-2">
                <div class="mb-2">
                  <label for="multiFileUpload" class="form-label form-label-sm">Upload Livery Files:</label>
                  <input type="file" class="form-control form-control-sm" id="multiFileUpload" accept=".png,.json" multiple />
                </div>
                <div class="mb-2">
                  <button id="unloadCustomLivery" class="btn btn-outline-secondary btn-sm">Unload Custom Livery Files</button>
                </div>
              </div>
            </div>
          </div>
          
          <div class="col-md-3">
            <div class="card">
              <div class="card-header p-2">Info</div>
              <div class="card-body p-2">
                <p class="mb-1">App made by blumlaut</p>
                <p class="mb-1"><a href="https://github.com/blumlaut/acc-livery-viewer" class="text-decoration-none">https://github.com/blumlaut/acc-livery-viewer</a></p>
                <p class="mb-1">Cubemaps made by Emil Persson, aka Humus</p>
                <p class="mb-1"><a href="http://www.humus.name" class="text-decoration-none">http://www.humus.name</a></p>
              </div>
            </div>
          </div>
      </div>

        <div id="liveryLayer" class="row">
            <div class="col-md-3">
              <div class="card">
                <div class="card-header p-2">Layer 1</div>
                <div class="card-body p-2">
                  <div class="row">
                    <div class="col-6">
                      <color-picker id="layer1Color" color-id="237"></color-picker>
                    </div>
                    <div class="col-6">
                      <select class="form-select" id="layer1Material">
                        <option value="glossy">glossy</option>
                        <option value="matte">matte</option>
                        <option value="satin">satin</option>
                        <option value="satinMetallic">satinMetallic</option>
                        <option value="metallic">metallic</option>
                        <option value="chrome">chrome</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-md-3">
              <div class="card">
                <div class="card-header p-2">Layer 2</div>
                <div class="card-body p-2">
                  <div class="row">
                    <div class="col-6">
                      <color-picker id="layer2Color" color-id="148"></color-picker>
                    </div>
                    <div class="col-6">
                      <select class="form-select" id="layer2Material">
                        <option value="glossy">glossy</option>
                        <option value="matte">matte</option>
                        <option value="satin">satin</option>
                        <option value="satinMetallic">satinMetallic</option>
                        <option value="metallic">metallic</option>
                        <option value="chrome">chrome</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-md-3">
              <div class="card">
                <div class="card-header p-2">Layer 3</div>
                <div class="card-body p-2">
                  <div class="row">
                    <div class="col-6">
                      <color-picker id="layer3Color" color-id="342"></color-picker>
                    </div>
                    <div class="col-6">
                      <select class="form-select" id="layer3Material">
                        <option value="glossy">glossy</option>
                        <option value="matte">matte</option>
                        <option value="satin">satin</option>
                        <option value="satinMetallic">satinMetallic</option>
                        <option value="metallic">metallic</option>
                        <option value="chrome">chrome</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-md-3">
              <div class="card">
                <div class="card-header p-2">Rims</div>
                <div class="card-body p-2">
                  <div class="row">
                    <div class="col-6">
                      <color-picker id="rimColor" color-id="341"></color-picker>
                    </div>
                    <div class="col-6">
                      <select class="form-select" id="rimMaterial">
                        <option value="glossy">glossy</option>
                        <option value="matte">matte</option>
                        <option value="satin">satin</option>
                        <option value="satinMetallic">satinMetallic</option>
                        <option value="metallic">metallic</option>
                        <option value="chrome">chrome</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          
    </div>
    
    <div id="dropZone">
      <div id="modelContainer">
          <div id="overlay">
              <p id="models">Models: </p>
              <p id="textures">Textures: </p>
              <p id="polygons">Polygons: </p>

              <br>
              <p id="loadedCar">Car: </p>
              <p id="skinId">Skin ID: </p>
              <p id="skinColours">Colours: </p>

            </div>
      </div>
    </div>
	<canvas id="hiddenCanvas" ></canvas>
</body>
</html>
